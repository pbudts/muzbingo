[build-system]
requires = ["setuptools>=77"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "muzbingo"
version = "0.1.0"
description = "Create music bingo cards from a playlist"
readme = "README.md"
requires-python = ">=3.11"
# The card templates (src/muzbingo/templates) and the host sheet template are CC0-1.0,
# everything else GPL-3.0-or-later.
license = "GPL-3.0-or-later AND CC0-1.0"
license-files = ["LICENSE", "src/muzbingo/templates/LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Natural Language :: English",
    "Natural Language :: Dutch",
]
dependencies = [
    "PySide6>=6.6",
    "Jinja2>=3.1",
    "openpyxl>=3.1",
    "nicegui>=4.0",
]

[project.urls]
Source = "https://github.com/pbudts/muzbingo"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "Babel>=2.12",  # extract and compile translations
]
build = [
    "pyinstaller>=6.10",
    "Babel>=2.12",
]

[project.scripts]
muzbingo = "muzbingo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muzbingo = ["templates/**/*", "render/*.j2", "i18n/locale/**/*.mo", "desktop/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
main_file = "tests/ui/main.py"
