[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "muzbingo"
version = "0.1.0"
description = "Create music bingo cards from a playlist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "Jinja2>=3.1",
    "openpyxl>=3.1",
    "nicegui>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "Babel>=2.12",  # extract and compile translations
]
build = [
    "pyinstaller>=6.10",
    "Babel>=2.12",
]

[project.scripts]
muzbingo = "muzbingo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muzbingo = ["templates/**/*", "render/*.j2", "i18n/locale/**/*.mo", "desktop/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
main_file = "tests/ui/main.py"
