<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 210" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f45"/>
      <stop offset="0.55" stop-color="#3b1670"/>
      <stop offset="1" stop-color="#7a1a6e"/>
    </linearGradient>
    <radialGradient id="glow-pink">
      <stop offset="0" stop-color="#ff3fa4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3fa4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop offset="0" stop-color="#33d1ff" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#33d1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl">
      <stop offset="0" stop-color="#2e2a3a"/>
      <stop offset="1" stop-color="#0c0a14"/>
    </radialGradient>
  </defs>

  <rect width="297" height="210" fill="url(#sky)"/>
  <circle cx="255" cy="15" r="95" fill="url(#glow-pink)"/>
  <circle cx="25" cy="195" r="115" fill="url(#glow-cyan)"/>

  <!-- vinyl record, left side -->
  <g transform="translate(38 122)">
    <circle r="46" fill="url(#vinyl)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.4">
      <circle r="43"/><circle r="40"/><circle r="37"/><circle r="34"/>
      <circle r="31"/><circle r="28"/><circle r="25"/><circle r="22"/><circle r="19"/>
    </g>
    <path d="M -30 -30 A 42 42 0 0 1 10 -41" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2" stroke-linecap="round"/>
    <circle r="14" fill="#d1006f"/>
    <circle r="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.4"/>
    <circle r="1.8" fill="#1b0f45"/>
  </g>

  <!-- music notes -->
  <g fill="#ffffff" fill-opacity="0.16" font-family="DejaVu Sans, Segoe UI Symbol, Arial, sans-serif">
    <text x="92" y="58" font-size="16">♪</text>
    <text x="20" y="62" font-size="11">♫</text>
    <text x="70" y="186" font-size="13">♪</text>
    <text x="268" y="50" font-size="12">♫</text>
    <text x="150" y="52" font-size="9">♪</text>
  </g>

  <!-- equalizer bars along the top edge -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="96" y="0" width="4" height="9"/>
    <rect x="102" y="0" width="4" height="15"/>
    <rect x="108" y="0" width="4" height="6"/>
    <rect x="114" y="0" width="4" height="12"/>
    <rect x="180" y="0" width="4" height="7"/>
    <rect x="186" y="0" width="4" height="13"/>
    <rect x="192" y="0" width="4" height="5"/>
    <rect x="198" y="0" width="4" height="10"/>
  </g>
</svg>
